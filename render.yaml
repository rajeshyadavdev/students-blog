services:
    - type: web
    name: my-blog
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: flask --app wsgi db upgrade && gunicorn wsgi:app
    envVars:
            - key: FLASK_ENV
        value: production
            - key: WORK_ENV
        value: PROD
            - key: HTTPS_ENABLED
        value: "true"
            - key: SECRET_KEY
        generateValue: true
            - key: DATABASE_URL
        fromDatabase:
          name: blog-db
          property: connectionString
            - key: PYTHON_VERSION
        value: 3.11.0

databases:
    - name: blog-db
    databaseName: blog
    plan: free