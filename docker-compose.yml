services:
  # db wala service hata diya - ab Render wala DB use hoga
  web:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      FLASK_APP: wsgi.py
      FLASK_ENV: production
      # Ab ye .env se aayega, yaha hardcode nahi hai
      DATABASE_URL: ${DATABASE_URL}
    volumes:
      - profile_pics:/app/blog/static/profile_pic
    # depends_on bhi hata diya kyuki ab local db hai hi nahi

volumes:
  profile_pics: